name: Checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libopengl0 libxkbcommon0 libfontconfig1 libglib2.0-0 libdbus-1-3
          python -m pip install --upgrade pip
          python -m pip install pyflakes shellcheck-py PySide6-Essentials

      - name: Python syntax and lint
        run: |
          python -m py_compile common/*.py ovms-manager/*.py lectern/*.py tools/*.py
          python -m pyflakes common/*.py ovms-manager/*.py lectern/*.py tools/*.py

      - name: Shell scripts
        run: shellcheck ovms-manager/*.sh lectern/*.sh packaging/*.sh packaging/AppRun

      - name: Translations are complete
        run: python tools/check_translations.py

      - name: Theme colors meet WCAG 2.2 AA
        run: python tools/check_contrast.py

      - name: Batch transcriber command line
        run: python lectern/transcribe.py --help
