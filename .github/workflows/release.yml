name: Release binaries

# Builds the AppImages of both apps and attaches them to the GitHub release of the tag.
# Runs on every pushed tag "v*"; it can also be started by hand for an existing tag (Actions → Run workflow).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build, e.g. v1.0.0 (1.0.0 works too)"
        required: true

permissions:
  contents: write

jobs:
  appimages:
    runs-on: ubuntu-22.04
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: System libraries for the import check
        # what Qt loads from the system (the same as on a desktop), plus libpulse for QtMultimedia
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libopengl0 libxkbcommon0 libfontconfig1 \
            libglib2.0-0 libdbus-1-3 libpulse0

      - name: Resolve the tag
        run: |
          TAG="${TAG#refs/tags/}"
          [[ "$TAG" == v* ]] || TAG="v$TAG"   # accept "1.0.0" typed by hand
          git rev-parse -q --verify "refs/tags/$TAG" > /dev/null || {
            echo "::error::Tag $TAG does not exist. Existing tags: $(git tag | tr '\n' ' ')"; exit 1; }
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Build the AppImages from the tag
        # the build script of this checkout builds the sources of the tag, so older tags can be rebuilt too
        run: |
          git worktree add --detach "$RUNNER_TEMP/src" "refs/tags/$TAG"
          bash packaging/build-appimage.sh --source "$RUNNER_TEMP/src" --out dist

      - name: Smoke test
        run: |
          chmod +x dist/*.AppImage
          ./dist/Lectern-*-x86_64.AppImage --appimage-extract-and-run transcribe --help > /dev/null
          echo "lectern-transcribe inside the AppImage works"

      - name: Attach them to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" > /dev/null 2>&1 || \
            gh release create "$TAG" --title "${TAG#v}" --notes "See [CHANGELOG.md](CHANGELOG.md) for the changes."
          gh release upload "$TAG" dist/*.AppImage dist/SHA256SUMS --clobber
